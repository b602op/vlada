<!DOCTYPE html>
<html lang="ru" data-theme="{{THEME}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
{{KEYWORDS_META}}
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:locale" content="ru_RU">
<meta name="robots" content="{{ROBOTS}}">
{{FAVICON}}
<style>{{CSS}}</style>
</head>
<body>
<a class="skip-link" href="#main-content">Перейти к основному содержанию</a>
<header class="site-header" id="site-header">
  <nav class="nav-container" aria-label="Основная навигация">
    <div class="logo">{{LOGO_TEXT}}</div>
    <ul class="nav-links" role="list">
      {{NAV_LINKS}}
    </ul>
    <button class="nav-toggle" aria-label="Открыть меню" aria-expanded="false">☰</button>
  </nav>
</header>
<main id="main-content">
{{SECTIONS}}
</main>
<footer class="site-footer">
  <div class="container">
    <p>&copy; {{YEAR}} {{FOOTER_TEXT}}. Все права защищены.</p>
  </div>
</footer>
<!-- Mobile sticky CTA -->
<div class="mobile-cta-bar" aria-hidden="true">
  <a href="#agent" class="btn btn-primary mobile-cta-btn">Оставить заявку</a>
</div>
<script type="text/javascript">{{SCRIPT}}</script>
{{ANALYTICS_SCRIPT}}
</body>
</html>
